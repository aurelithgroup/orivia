name: Orivia AI development checks
on:
  push:
    branches:
      - feature/proactive-requirements
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check js/buddy.js
          node --check js/orivia-ai-bridge.js
          node --check workers/orivia-ai-preview.mjs
      - name: SPEA official directory feed
        run: node tests/spea-directory-feed.test.mjs
      - name: OpenAI private pilot transport (offline only)
        run: node tests/openai-pilot.test.mjs
      - name: Pilot assistant (consent v3, scripted model)
        run: node tests/assistant.test.mjs
      - name: Assistant timing and same-turn page reuse
        run: node tests/assistant-timing.test.mjs
      - name: Buddy rule and conversation regression tests
        run: node tests/buddy-smoke.js
      - name: Secure AI bridge tests
        run: node tests/ai-bridge.test.js
      - name: Consent and open-ended AI entry tests
        run: node tests/ai-chat-consent.test.js
      - name: Native calendar and Google draft flow
        run: node tests/native-calendar.test.cjs
      - name: Live official fetch and calendar alarms
        run: node tests/live-official-and-reminders.test.mjs
      - name: Official-only source policy and Heriot-Watt details
        run: node tests/official-sources.test.mjs
      - name: Verified university journey resources
        run: node tests/journey-sources.test.mjs
      - name: Journey API contract tests
        run: node --experimental-sqlite tests/journey-api.test.mjs
      - name: Journey chat does not loop (16 Oct regression)
        run: node tests/journey-adapter-loop.test.mjs
      - name: Natural first-contact conversations
        run: node tests/natural-entry.test.mjs
      - name: Realistic journey intelligence scenarios (with tracked TODO gaps)
        run: node --test tests/journey-intelligence.test.mjs
      - name: Transport is actionable (Maps links, no made-up times, no stray reminders)
        run: node tests/transport-actions.test.mjs
      - name: Device-first Maps and calendar handoffs
        run: node tests/device-handoffs.test.mjs
      - name: Journey cards (decision-only, three choices, route-aware nol guide)
        run: node tests/guide-cards.test.mjs
      - name: Settings and Calendar
        run: node tests/settings-calendar.test.mjs
      - name: Research display (fixtures)
        run: node tests/research-display.test.mjs
      - name: Chat history and origin
        run: node tests/chat-history.test.mjs
      - name: Beta Start waits for server verification
        run: node tests/beta-start.test.mjs
      - name: Source-controlled research and founder acceptance scenarios
        run: node --experimental-sqlite tests/research.test.mjs
      - name: School task state and named lookups
        run: node tests/school-task-integration.test.mjs
      - name: Research follows the current task
        run: node tests/research-follow-through.test.mjs
      - name: Sharjah school discovery from official SPEA profiles
        run: node tests/research-schools.test.mjs
      - name: Information cards (sourced facts and contacts only)
        run: node tests/information-cards.test.mjs
      - name: SPEA reader (beyond page 1, name lookup, coverage and failures)
        run: node tests/spea-reader.test.mjs
      - name: School websites anchored to SPEA (identity, domain proof, facts tied to source)
        run: node tests/school-sites.test.mjs
      - name: Research loop (understand, research, coverage, answer the latest question)
        run: node tests/research-loop.test.mjs
      - name: Research loop through the Worker (opt-in, auth and quota first)
        run: node --experimental-sqlite tests/research-loop-worker.test.mjs
      - name: Website reader against raw captured pages
        run: node tests/site-captures.test.mjs
      - name: Website reader across page layouts (link ranking, year tables, labelled curriculum)
        run: node tests/site-reader-layouts.test.mjs
      - name: Navigation and year evidence on raw captured pages
        run: node tests/site-captures-navigation.test.mjs
      - name: Research agent (whole process: model-chosen steps, code-enforced rules, Ina's case study)
        run: node tests/research-agent.test.mjs
      - name: Searching like a person with labelled evidence (listing sites, own websites, reworded searches)
        run: node --experimental-sqlite tests/research-web-evidence.test.mjs
      - name: Shared spending ledger (atomic day/month limits, uncertain outcomes kept)
        run: node --experimental-sqlite tests/spend-ledger.test.mjs
      - name: Browser directory tool (scripted fake browser; counter-ahead guard, host checks, long lists)
        run: node tests/browser-directory.test.mjs
      - name: Private research pilot entry (consent naming OpenAI, gates, public Worker untouched)
        run: node --experimental-sqlite tests/research-pilot.test.mjs
      - name: Provider comparison harness (scripted conversations, aggregate metrics)
        run: node --experimental-sqlite tests/provider-comparison.test.mjs
      - name: Public beta mode (human check, per-person and daily limits)
        run: node --experimental-sqlite tests/public-beta.test.mjs
      - name: AI Worker contract and safety tests
        run: node tests/ai-preview.test.mjs
      - name: Read-only journey tool regression tests
        run: node tests/ai-journey-tools.test.mjs
