name: Orivia AI development checks
on:
  push:
    branches:
      - feature/proactive-requirements
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check js/buddy.js
          node --check js/orivia-ai-bridge.js
          node --check workers/orivia-ai-preview.mjs
      - name: Buddy rule and conversation regression tests
        run: node tests/buddy-smoke.js
      - name: Secure AI bridge tests
        run: node tests/ai-bridge.test.js
      - name: Consent and open-ended AI entry tests
        run: node tests/ai-chat-consent.test.js
      - name: Native calendar and Google draft flow
        run: node tests/native-calendar.test.cjs
      - name: Live official fetch and calendar alarms
        run: node tests/live-official-and-reminders.test.mjs
      - name: Official-only source policy and Heriot-Watt details
        run: node tests/official-sources.test.mjs
      - name: Verified university journey resources
        run: node tests/journey-sources.test.mjs
      - name: Journey API contract tests
        run: node --experimental-sqlite tests/journey-api.test.mjs
      - name: Journey chat does not loop (16 Oct regression)
        run: node tests/journey-adapter-loop.test.mjs
      - name: Natural first-contact conversations
        run: node tests/natural-entry.test.mjs
      - name: Realistic journey intelligence scenarios (with tracked TODO gaps)
        run: node --test tests/journey-intelligence.test.mjs
      - name: Transport is actionable (Maps links, no made-up times, no stray reminders)
        run: node tests/transport-actions.test.mjs
      - name: Device-first Maps and calendar handoffs
        run: node tests/device-handoffs.test.mjs
      - name: Journey cards (decision-only, three choices, route-aware nol guide)
        run: node tests/guide-cards.test.mjs
      - name: Settings and Calendar
        run: node tests/settings-calendar.test.mjs
      - name: Research display (fixtures)
        run: node tests/research-display.test.mjs
      - name: Beta Start waits for server verification
        run: node tests/beta-start.test.mjs
      - name: Source-controlled research and founder acceptance scenarios
        run: node --experimental-sqlite tests/research.test.mjs
      - name: Public beta mode (human check, per-person and daily limits)
        run: node --experimental-sqlite tests/public-beta.test.mjs
      - name: AI Worker contract and safety tests
        run: node tests/ai-preview.test.mjs
      - name: Read-only journey tool regression tests
        run: node tests/ai-journey-tools.test.mjs
