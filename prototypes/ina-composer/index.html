<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orivia · Composer preview</title><style>
:root{--surface:#fffdf8;--line:#dedbd2;color:#1c2733;background:#f5f2ea;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:30px 20px;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;letter-spacing:.15em;margin:0}.badge{font-size:10px;letter-spacing:.1em;background:#ecdfb6;padding:6px 9px;border-radius:20px}.intro{margin:54px 0 20px}h2{font-size:clamp(27px,5vw,38px);letter-spacing:-.045em;font-weight:550;margin:0 0 10px}.muted{color:#777c7a;font-size:13px;line-height:1.6}.examples{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button.demo{border:1px solid var(--line);border-radius:99px;background:transparent;padding:9px 13px;color:inherit;cursor:pointer}.history{flex:1;min-height:100px;margin:25px 0}.sent{background:#eee7d8;border-radius:20px 20px 5px 20px;padding:15px;max-width:85%;margin:0 0 20px auto;overflow-wrap:anywhere}.sent p{white-space:pre-wrap;margin:8px 0}.sent img{display:block;max-width:200px;max-height:160px;border-radius:12px;margin-bottom:8px}.sent a{display:inline-block;color:inherit;font-size:13px;border:1px solid #c8bfaa;border-radius:12px;padding:12px;text-decoration:none}.footer{font-size:11px;text-align:center;color:#868883;margin:13px 0}.oc-controls{padding-top:2px}body.dark{--surface:#202d38;--line:#42505b;background:#17232e;color:#f4f0e8}body.dark .sent{background:#33414b}body.dark .muted{color:#b5bcbf}body.dark .badge{background:#4a462f;color:#f4d46b}@media(max-width:480px){main{padding:20px 12px}.intro{margin-top:40px}.history{min-height:80px}.badge{font-size:9px}.sent{max-width:92%}}
.oc-composer{position:relative;border:1px solid var(--line,#ddd9cf);border-radius:24px;padding:12px;background:var(--surface,#fffdf8);box-shadow:0 4px 18px #17273508;box-sizing:border-box}.oc-composer:focus-within{border-color:#b9973f;box-shadow:0 0 0 3px #edc65919}.oc-text{display:block;resize:none;box-sizing:border-box;width:100%;min-height:46px;max-height:192px;border:0;outline:none;background:transparent;color:inherit;font:inherit;font-size:16px;line-height:1.5;padding:6px 8px 10px}.oc-controls,.oc-right{display:flex;align-items:center;gap:8px}.oc-controls{justify-content:space-between}.oc-left{position:relative}.oc-button{border:0;background:transparent;color:inherit;min-width:44px;min-height:44px;border-radius:50%;cursor:pointer;font:inherit;display:inline-flex;align-items:center;justify-content:center}.oc-button:hover{background:#d8bf7330}.oc-button:focus-visible{outline:2px solid #98721a;outline-offset:3px}.oc-button:disabled{opacity:.4;cursor:default}.oc-button svg{width:21px;height:21px}.oc-plus{font-size:29px;font-weight:300}.oc-send{background:#edc659;color:#1c2733;font-size:26px}.oc-send:hover{background:#e5b935}.oc-menu{position:absolute;inset-inline-start:0;bottom:calc(100% + 10px);width:210px;padding:7px;border-radius:18px;border:1px solid var(--line,#ddd9cf);background:var(--surface,#fffdf8);box-shadow:0 10px 35px #17273525;z-index:10}.oc-menu[hidden]{display:none}.oc-menu .oc-button{display:flex;width:100%;border-radius:11px;justify-content:flex-start;padding:0 12px;font-size:14px}.oc-previews:empty{display:none}.oc-previews{padding:4px 4px 10px}.oc-attachment{position:relative;width:min(260px,calc(100% - 4px));min-height:66px;border:1px solid var(--line,#ddd9cf);border-radius:15px;box-sizing:border-box;padding:13px 35px 13px 46px;overflow:visible}.oc-file-name{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.oc-file-type{font-size:11px;opacity:.65}.oc-file-icon{position:absolute;inset-inline-start:16px;top:22px}.oc-photo{width:146px;height:116px;padding:0;border:0}.oc-photo img{width:100%;height:100%;object-fit:cover;border-radius:15px}.oc-remove{position:absolute;inset-inline-end:-7px;top:-7px;min-width:32px;min-height:32px;width:32px;height:32px;background:#1c2733;color:white;border:2px solid var(--surface,#fffdf8);font-size:22px;line-height:1}.oc-remove:hover{background:#3b4650}.oc-feedback{font-size:12px;margin:7px 8px 0;min-height:1.3em;opacity:.7}.oc-feedback:empty{min-height:0;margin:0}
</style><main><header><h1>ORIVIA<span style="color:#b38a25"> ✦</span></h1><span class="badge">INTERACTIVE PREVIEW</span></header><section class="intro"><h2>A little room to say it all.</h2><p class="muted">Full-width typing. Attachments inside. Everything travels together.</p><div class="examples"><button class="demo" id="sample-photo">Try an image</button><button class="demo" id="sample-file">Try a file</button><button class="demo" id="theme">Light / dark</button><button class="demo" id="rtl">LTR / RTL</button></div></section><div class="history" id="history"><p class="muted">Choose a sample, write a message, then send.<br>This preview stays on this page. No file or message goes to AI.</p></div><div id="composer"></div><p class="footer">Preview only · Enter adds a line · Ctrl / ⌘ + Enter sends</p></main><script>/* Independent composer UI. No network, AI, storage, microphone or camera permission calls.
 * Cleo connects callbacks to the existing consent, file preparation, account and send controls. */
(function(){
 'use strict';
 function mount(root,{onSend=async()=>{},onVoice=()=>{},onUploads=async()=>null,text=s=>s}={}){
  const doc=root.ownerDocument;let attachment=null,objectURL=null,revision=0,sending=false,disposed=false,hoverTimer;
  const el=(tag,cls,label)=>{const n=doc.createElement(tag);if(cls)n.className=cls;if(label!=null)n.textContent=text(label);return n};
  const button=(label,content,fn)=>{const b=el('button','oc-button',content);b.type='button';b.setAttribute('aria-label',text(label));b.title=text(label);b.onclick=fn;return b};
  const form=el('form','oc-composer'),previews=el('div','oc-previews'),area=el('textarea','oc-text');area.rows=1;area.maxLength=2000;area.placeholder=text('Message Orivia…');area.setAttribute('aria-label',text('Your message'));
  const controls=el('div','oc-controls'),left=el('div','oc-left'),right=el('div','oc-right'),menu=el('div','oc-menu');menu.hidden=true;menu.id='oc-menu-'+Math.random().toString(36).slice(2);menu.setAttribute('aria-label',text('Add an attachment'));
  const feedback=el('p','oc-feedback');feedback.setAttribute('role','status');
  function closeMenu(){menu.hidden=true;plus.setAttribute('aria-expanded','false')}
  function openMenu(focus=false){if(sending)return;clearTimeout(hoverTimer);menu.hidden=false;plus.setAttribute('aria-expanded','true');if(focus)menu.querySelector('button')?.focus()}
  const plus=button('Add an attachment','+',()=>openMenu(true));plus.classList.add('oc-plus');plus.setAttribute('aria-expanded','false');plus.setAttribute('aria-controls',menu.id);
  const voice=button('Speak your message','',onVoice);const svg=doc.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.8');svg.setAttribute('aria-hidden','true');const path=doc.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M8 7a4 4 0 018 0v4a4 4 0 01-8 0V7M5 10v2a7 7 0 0014 0v-2M12 19v3m-4 0h8');svg.append(path);voice.append(svg);
  const send=button('Send','↑',()=>form.requestSubmit());send.classList.add('oc-send');
  const picks=[];
  function picker(label,accept,capture){const input=el('input');input.type='file';input.accept=accept;input.hidden=true;if(capture)input.setAttribute('capture',capture);const b=button(label,label,()=>{closeMenu();input.click()});input.onchange=()=>{const file=input.files?.[0];input.value='';if(file)setAttachment({file})};picks.push(input);menu.append(b)}
  picker('Camera','image/jpeg,image/png','environment');picker('Photos','image/jpeg,image/png');picker('Files','.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png');
  const uploads=button('Saved uploads','Saved uploads',async()=>{closeMenu();const version=revision;try{const selected=await onUploads();if(selected&&!disposed&&revision===version)setAttachment(selected)}catch{if(!disposed&&revision===version)feedback.textContent=text('Couldn’t open saved uploads. Try again.')}});menu.append(uploads);
  function releasePreview(){if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null}}
  function render(){releasePreview();previews.replaceChildren();if(attachment){const card=el('div','oc-attachment'),f=attachment.file;const image=/^image\/(jpeg|png)$/.test(f.type);card.classList.toggle('oc-photo',image);if(image){objectURL=URL.createObjectURL(f);const img=el('img');img.src=objectURL;img.alt=text('Selected image')+': '+f.name;card.append(img)}else{card.append(el('span','oc-file-icon','↗'),el('strong','oc-file-name',f.name),el('small','oc-file-type','PDF · '+Math.max(1,Math.round(f.size/1024))+' KB'))}
   const remove=button('Remove attachment','×',()=>{attachment=null;revision++;feedback.textContent='';render();area.focus()});remove.classList.add('oc-remove');remove.disabled=sending;card.append(remove);previews.append(card)}send.disabled=sending||(!area.value.trim()&&!attachment);area.style.height='auto';area.style.height=Math.min(area.scrollHeight,192)+'px';area.style.overflowY=area.scrollHeight>192?'auto':'hidden';
  }
  function setAttachment(value){if(sending||disposed)return false;const f=value?.file;if(!f||!['application/pdf','image/jpeg','image/png'].includes(f.type)){feedback.textContent=text('Choose a PDF, JPEG or PNG file.');return false}if(f.size>10*1024*1024){feedback.textContent=text('That file is over 10 MB. Choose a smaller file.');return false}attachment={file:f,...(value.fileId?{fileId:value.fileId}:{})};revision++;feedback.textContent=text('Attached. Nothing has been sent yet.');render();area.focus();return true}
  area.oninput=()=>{revision++;send.disabled=sending||(!area.value.trim()&&!attachment);area.style.height='auto';area.style.height=Math.min(area.scrollHeight,192)+'px';area.style.overflowY=area.scrollHeight>192?'auto':'hidden'};
  form.onsubmit=async e=>{e.preventDefault();if(sending||(!area.value.trim()&&!attachment))return;closeMenu();const version=revision,draft={text:area.value,attachment};sending=true;area.readOnly=true;plus.disabled=voice.disabled=true;render();feedback.textContent=text('Preparing your message…');
   try{const result=await onSend(draft);if(disposed)return;if(result===false){feedback.textContent=text('Your draft is still here.');return}if(revision===version){attachment=null;area.value='';revision++}feedback.textContent=''}catch{if(!disposed)feedback.textContent=text('Couldn’t send. Your message and attachment are still here.')}finally{sending=false;if(!disposed){area.readOnly=false;plus.disabled=voice.disabled=false;render();area.focus()}}};
  form.onkeydown=e=>{if(e.key==='Escape'){closeMenu();plus.focus()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target===area){e.preventDefault();form.requestSubmit()}};
  const fine=()=>window.matchMedia?.('(hover:hover) and (pointer:fine)').matches;
  plus.onpointerenter=()=>{if(fine())openMenu()};const laterClose=()=>{hoverTimer=setTimeout(()=>{if(!left.matches(':hover')&&!left.contains(doc.activeElement))closeMenu()},180)};left.onpointerleave=laterClose;left.onpointerenter=()=>clearTimeout(hoverTimer);
  const outside=e=>{if(!left.contains(e.target))closeMenu()};doc.addEventListener('pointerdown',outside);
  left.append(plus,menu);right.append(voice,send);controls.append(left,right);form.append(previews,area,controls,...picks);root.replaceChildren(form,feedback);render();
  return {setAttachment,focus:()=>area.focus(),reset(){revision++;attachment=null;area.value='';closeMenu();render()},destroy(){disposed=true;revision++;releasePreview();clearTimeout(hoverTimer);doc.removeEventListener('pointerdown',outside);root.replaceChildren()}};
 }
 window.OriviaComposer={mount};
})();

const messages=document.getElementById('history');let first=true;
const samplePdf=()=>new File(['%PDF-1.4\n% Sample interface file, not for document analysis'], 'Welcome guide.pdf',{type:'application/pdf'});
const mount=window.OriviaComposer.mount(document.getElementById('composer'),{onVoice(){alert('The existing dictation control will connect here. This preview does not request microphone access.')},async onUploads(){return {file:samplePdf(),fileId:'demo-file'}},async onSend({text,attachment}){if(first){messages.replaceChildren();first=false}const bubble=document.createElement('article');bubble.className='sent';if(attachment){const file=attachment.file,url=URL.createObjectURL(file);if(file.type.startsWith('image/')){const img=document.createElement('img');img.src=url;img.alt=file.name;bubble.append(img)}else{const a=document.createElement('a');a.href=url;a.download=file.name;a.textContent='↗ '+file.name;bubble.append(a)}}if(text){const p=document.createElement('p');p.textContent=text;bubble.append(p)}messages.append(bubble);bubble.scrollIntoView({block:'nearest',behavior:'smooth'});}});
document.getElementById('sample-file').onclick=()=>mount.setAttachment({file:samplePdf()});
document.getElementById('sample-photo').onclick=()=>{const c=document.createElement('canvas');c.width=420;c.height=300;const x=c.getContext('2d');x.fillStyle='#e2c36c';x.fillRect(0,0,420,300);x.fillStyle='#fffdf6';x.fillRect(87,25,248,258);x.fillStyle='#23323c';x.font='bold 21px system-ui';x.fillText('A fresh start.',108,73);x.font='13px system-ui';x.fillText('Your welcome guide',108,100);x.fillStyle='#ddd8c9';for(let i=0;i<5;i++)x.fillRect(108,132+i*20,180-i%2*35,5);x.fillStyle='#ab8126';x.font='11px system-ui';x.fillText('SAMPLE IMAGE · NO PERSONAL DATA',108,254);c.toBlob(b=>mount.setAttachment({file:new File([b],'Welcome photo.png',{type:'image/png'})}),'image/png')};
document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');document.getElementById('rtl').onclick=()=>document.documentElement.dir=document.documentElement.dir==='rtl'?'ltr':'rtl';
</script></html>
