<title>Northbay Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a demo control strip (who you are + milestone), then that person's Orivia, with an activity log beside it. */
:root{
 --ground:#E9ECE7; --surface:#FFFFFF; --surface2:#F3F5F1; --line:#D6DBD4; --ink:#18222D; --muted:#56616C;
 --sign:#1C2733; --signInk:#F4F6F7; --amber:#F2B90F; --amberSoft:#FFF3C9; --amberInk:#6B4E00;
 --ok:#1D7F55; --okSoft:#DDF0E6; --warn:#A8480A; --warnSoft:#FBE7D9; --focus:#2F6FEB; --focusSoft:#E4ECFD;
 --display:Georgia,"Times New Roman",serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --ground:#0B1015; --surface:#141B23; --surface2:#1A232D; --line:#29333E; --ink:#E6EAEE; --muted:#9AA5B0;
 --sign:#080C10; --signInk:#F4F6F7; --amber:#F2B90F; --amberSoft:#3A3110; --amberInk:#F7D873;
 --ok:#46C08A; --okSoft:#15342A; --warn:#F2914A; --warnSoft:#3A2414; --focus:#7AA5FF; --focusSoft:#18284A; color-scheme:dark}}
:root[data-theme="dark"]{
 --ground:#0B1015; --surface:#141B23; --surface2:#1A232D; --line:#29333E; --ink:#E6EAEE; --muted:#9AA5B0;
 --sign:#080C10; --signInk:#F4F6F7; --amber:#F2B90F; --amberSoft:#3A3110; --amberInk:#F7D873;
 --ok:#46C08A; --okSoft:#15342A; --warn:#F2914A; --warnSoft:#3A2414; --focus:#7AA5FF; --focusSoft:#18284A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
/* Demo strip */
.strip{background:var(--sign);color:var(--signInk)}
.strip .wrap{padding-block:14px;display:flex;flex-direction:column;gap:12px}
.strip-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.16em}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--amber);color:#1C2733}
.strip small{color:#C9D1D8}
.people{display:flex;gap:8px;flex-wrap:wrap}
.person{border:1px solid #3A4756;background:transparent;color:var(--signInk);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.person span{font-size:12px;color:#B9C3CC}
.person[aria-pressed="true"]{background:var(--amber);color:#1C2733;border-color:var(--amber)}
.person[aria-pressed="true"] span{color:#3B2E00}
.milestone{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.milestone li{font-size:13px;border-radius:999px;padding:4px 10px;background:#26323F;color:#C9D1D8}
.milestone li.done{background:#1E4D3A;color:#DFF5EA}
.milestone li.done::before{content:"✓ ";font-weight:700}
.ghost-light{background:transparent;border:1px solid #3A4756;color:var(--signInk);border-radius:999px;padding:8px 14px;cursor:pointer}
/* Main */
.main .wrap{padding-block:24px 48px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:980px){.main .wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:24px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.btn{border:0;background:var(--sign);color:#FFFFFF;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
:root[data-theme="dark"] .btn{background:var(--amber);color:#1C2733}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--amber);color:#1C2733}}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#FFFFFF}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.why{font-size:12px;color:var(--warn)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.field input,.field select,.field textarea{font-weight:400;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.c-ok{background:var(--okSoft);color:var(--ok)}
.c-wait{background:var(--focusSoft);color:var(--focus)}
.c-warn{background:var(--warnSoft);color:var(--warn)}
.c-demo{background:var(--amberSoft);color:var(--amberInk)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{background:transparent;border:1px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface2);border-color:var(--line);color:var(--ink);font-weight:700}
.tab .lock{font-size:11px;margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi strong{font-size:26px;font-variant-numeric:tabular-nums}
.denied{border:2px solid var(--warn);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--warnSoft)}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
/* Phone */
.phone{width:min(100%,390px);margin:0 auto;border:9px solid var(--sign);border-radius:38px;overflow:hidden;background:var(--surface2);min-height:720px;display:flex;flex-direction:column}
.phone-top{background:var(--sign);color:var(--signInk);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.phone-body{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:19px}
.spaces{display:flex;gap:8px;flex-wrap:wrap}
.space{border:1px solid #3A4756;background:transparent;color:var(--signInk);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.space[aria-selected="true"]{background:var(--amber);color:#1C2733;border-color:var(--amber);font-weight:700}
.step{display:flex;gap:10px;align-items:center}
.dot{width:24px;height:24px;flex:0 0 24px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.dot.todo{border-color:var(--warn);color:var(--warn)}
.qr{width:96px;height:96px;flex:0 0 96px;border-radius:8px;background:#FFFFFF;border:1px solid var(--line);image-rendering:pixelated}
/* Log */
.log{position:sticky;top:max(16px,env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{font-size:13px;border-left:3px solid var(--line);padding:4px 0 4px 10px}
.log li.allowed{border-left-color:var(--ok)}
.log li.denied{border-left-color:var(--warn)}
.log code{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.panel,.phone{transition:background .2s}}
</style>

<header class="strip" aria-label="Demo controls">
 <div class="wrap">
  <div class="strip-top">
   <span class="brand">ORIVIA</span>
   <span class="tag">Northbay demo · sample data</span>
   <small class="grow">Northbay University is fictional. Nothing here is saved or sent anywhere.</small>
   <button type="button" class="ghost-light" data-action="reset" id="reset">Start over</button>
  </div>
  <div class="people" role="group" aria-label="View Orivia as" id="people"></div>
  <ol class="milestone" aria-label="First working flow" id="milestone"></ol>
 </div>
</header>

<main class="main">
 <div class="wrap">
  <section id="view" aria-live="polite"></section>
  <aside class="panel log" aria-label="Activity and permission checks">
   <h2>What just happened</h2>
   <p class="small muted">Every action is checked against the person's role. This is the list of checks Ina's server will make.</p>
   <ol id="log"></ol>
  </aside>
 </div>
</main>

<script>
'use strict';
/* ---------- People (fictional) ---------- */
const PEOPLE={
 habeebah:{name:'Habeebah',role:'Orivia owner',email:'habeebah@orivia.example',platform:'owner'},
 mariam:{name:'Mariam K.',role:'Northbay international office',email:'mariam.k@northbay.example'},
 daniel:{name:'Daniel O.',role:'Northbay student services',email:'daniel.o@northbay.example'},
 aisha:{name:'Aisha R.',role:'Incoming student',email:'aisha.r@mail.example'},
 omar:{name:'Omar S.',role:'Not a Northbay member',email:'omar.s@mail.example'}
};
/* ---------- Permissions (Ina's review, 20 Oct) ----------
   Editors draft content and create public QR codes. Admins also publish, approve members and manage invitations and staff.
   Application records need their own permission (nobody has it here). A verified email never grants staff access. */
const ROLE_PERMS={
 editor:['content.draft','qr.public','analytics.view','org.view'],
 admin:['content.draft','content.publish','qr.public','qr.invite','members.manage','staff.manage','analytics.view','org.view'],
 student:['space.view']
};
const PLATFORM_PERMS={owner:['org.create','org.inviteAdmin','platform.view','support.view']};
const PERM_LABEL={'content.draft':'draft guides','content.publish':'publish guides','qr.public':'create public QR codes','qr.invite':'create member invitations','members.manage':'approve or remove members','staff.manage':'manage staff','analytics.view':'see counts','org.view':'open the staff dashboard','space.view':'open the Northbay space','records.view':'view individual application records','org.create':'create organisations','org.inviteAdmin':'invite an organisation admin','platform.view':'open Orivia management','support.view':'read support requests'};
function membership(pid,org){return S.memberships.find(m=>m.person===pid&&m.org===org)}
function can(pid,perm,org){
 const p=PEOPLE[pid];
 if(p.platform&&(PLATFORM_PERMS[p.platform]||[]).includes(perm))return {ok:true,why:'Orivia '+p.platform};
 if(!org)return {ok:false,why:'not an Orivia management permission for this person'};
 const m=membership(pid,org);
 if(!m||m.status!=='active')return {ok:false,why:m?('membership is '+m.status):'not a member of this organisation'};
 if(perm==='records.view')return (m.extra||[]).includes('records.view')?{ok:true,why:'separate records permission'}:{ok:false,why:'needs the separate application-records permission'};
 return (ROLE_PERMS[m.role]||[]).includes(perm)?{ok:true,why:m.role}:{ok:false,why:m.role+'s can’t '+PERM_LABEL[perm]};
}
/* ---------- State (sample data, in memory) ---------- */
const NB='northbay';
function fresh(){return {
 persona:'habeebah',tab:{owner:'orgs',org:'overview',student:'me'},studentScreen:null,
 orgs:{},memberships:[],codes:[],content:[],events:[],support:[],updates:[],
 personal:{aisha:{calendar:[],steps:[{id:'s1',text:'Book my medical fitness test',done:false},{id:'s2',text:'Buy a local SIM',done:true}],chats:2,shareSteps:false,saved:[]}},
 log:[],form:{},seq:1
}}
let S=fresh();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=p=>p+(S.seq++);
function log(text,check){S.log.unshift({text,check});S.log=S.log.slice(0,40)}
function guard(pid,perm,org,what){const r=can(pid,perm,org);log((r.ok?'Allowed: ':'Refused: ')+PEOPLE[pid].name+' — '+what,{perm,ok:r.ok,why:r.why});return r.ok}
function count(type){return S.events.filter(e=>e.type===type).length}
function shown(n){return n<10?'Fewer than 10':String(n)}

/* ---------- Milestone ---------- */
function milestone(){
 const org=S.orgs[NB],admin=S.memberships.find(m=>m.org===NB&&m.role==='admin'),inv=S.codes.find(c=>c.purpose==='invitation');
 const a=membership('aisha',NB);
 return [
  ['Northbay created',!!org],
  ['Admin accepted',admin&&admin.status==='active'],
  ['Invitation QR made',!!inv],
  ['Student asked to join',!!a],
  ['Admin approved',a&&a.status==='active'],
  ['Northbay inside Aisha’s Orivia',a&&a.status==='active'&&S.tab.student==='northbay'&&S.persona==='aisha'||(a&&a.status==='active'&&S.seenSpace)]
 ];
}

/* ---------- Rendering ---------- */
function render(){
 document.getElementById('people').innerHTML=Object.entries(PEOPLE).map(([k,p])=>`<button type="button" class="person" data-action="persona" data-id="${k}" aria-pressed="${S.persona===k}">${esc(p.name)}<span>${esc(roleLine(k))}</span></button>`).join('');
 document.getElementById('milestone').innerHTML=milestone().map(([t,d])=>`<li class="${d?'done':''}">${esc(t)}</li>`).join('');
 document.getElementById('log').innerHTML=S.log.length?S.log.map(l=>`<li class="${l.check?(l.check.ok?'allowed':'denied'):''}">${esc(l.text)}${l.check?`<br><code>${esc(l.check.perm)} · ${esc(l.check.why)}</code>`:''}</li>`).join(''):'<li class="muted">Nothing yet. Start as Habeebah and create Northbay.</li>';
 const v=document.getElementById('view');
 v.innerHTML=S.persona==='habeebah'?ownerView():S.persona==='aisha'||S.persona==='omar'?studentView(S.persona):staffView(S.persona);
}
function roleLine(k){const m=membership(k,NB);if(PEOPLE[k].platform)return 'Orivia owner';if(m)return 'Northbay '+(m.status==='active'?m.role:m.role+' · '+m.status);return PEOPLE[k].role}

/* ---- Owner ---- */
function ownerView(){
 const t=S.tab.owner,org=S.orgs[NB];
 const tabs=[['orgs','Organisations'],['support','Support'],['costs','Costs and limits']].map(([k,l])=>`<button type="button" class="tab" role="tab" aria-selected="${t===k}" data-action="tab" data-area="owner" data-id="${k}">${l}</button>`).join('');
 let body='';
 if(t==='orgs'){
  if(!org){body=S.form.newOrg?newOrgForm():`<div class="empty"><strong>No organisations yet</strong><p class="small muted">Create one to give its staff a dashboard and its members a space inside their Orivia.</p><button type="button" class="btn" data-action="newOrgForm">Add organisation</button></div>`}
  else{
   const admin=S.memberships.find(m=>m.org===NB&&m.role==='admin');
   const members=S.memberships.filter(m=>m.org===NB&&m.role==='student'&&m.status==='active').length;
   body=`<div class="list"><div class="item"><div class="grow"><strong>${esc(org.name)}</strong> <span class="chip c-demo">Demo</span><p class="small muted">${esc(org.type)} · ${esc(org.city)} · ${members} member${members===1?'':'s'}</p></div>
   ${!admin?`<span class="chip c-warn">Needs an admin</span>`:admin.status==='invited'?`<span class="chip c-wait">Admin invited</span>`:`<span class="chip c-ok">Active</span>`}</div></div>
   ${!admin?`<form class="row" data-form="inviteAdmin" style="align-items:flex-end"><label class="field grow" for="adminEmail">First admin’s email<input id="adminEmail" name="email" type="email" value="mariam.k@northbay.example" required></label><button class="btn" type="submit">Invite admin</button></form>`:''}
   ${admin&&admin.status==='invited'?`<p class="note">Waiting for ${esc(PEOPLE[admin.person].name)} to accept. Switch to Mariam to accept the invitation.</p>`:''}
   <p class="note">Orivia management shows organisations and counts. It never shows anyone’s chats or documents.</p>`;
  }
 }
 if(t==='support'){
  body=S.support.length?`<div class="list">${S.support.map(s=>`<div class="item"><div class="grow"><strong>${esc(s.subject)}</strong><p class="small muted">From ${esc(PEOPLE[s.from].name)} · ${esc(s.org||'No organisation')}</p><p class="small">Attached by them: ${s.attached.length?esc(s.attached.join(', ')):'nothing'}</p></div><span class="chip c-wait">Open</span></div>`).join('')}</div>`:`<div class="empty"><strong>No support requests</strong><p class="small muted">Requests show only what the person chose to attach. There is no way to open someone’s private chats from here.</p></div>`;
 }
 if(t==='costs'){
  body=`<div class="kpis"><div class="kpi"><span class="small muted">AI spend this month</span><strong>$11.40</strong><span class="small muted">of $20 · sample</span></div><div class="kpi"><span class="small muted">Today</span><strong>$0.62</strong><span class="small muted">of $5 · sample</span></div><div class="kpi"><span class="small muted">Searches this month</span><strong>61</strong><span class="small muted">of 100 · sample</span></div></div><p class="note">Sample figures for layout. Real numbers come from the spending ledger once connected.</p>`;
 }
 return `<div class="panel"><div class="row"><h2 class="grow">Orivia management</h2><span class="chip c-demo">Sample data</span></div><div class="tabs" role="tablist" aria-label="Management">${tabs}</div>${body}</div>`;
}
function newOrgForm(){return `<form class="panel" data-form="createOrg" style="padding:0;border:0"><label class="field" for="orgName">Name<input id="orgName" name="name" value="Northbay University" required></label>
 <div class="row"><label class="field grow" for="orgType">Type<select id="orgType" name="type"><option>University</option><option>College</option><option>Employer</option></select></label><label class="field grow" for="orgCity">City<input id="orgCity" name="city" value="Sharjah"></label></div>
 <p class="small muted">Marked as a demo organisation. It can’t be shown as a real partner.</p>
 <div class="row"><button class="btn" type="submit">Create organisation</button><button type="button" class="btn quiet" data-action="cancelOrg">Cancel</button></div></form>`}

/* ---- Staff (Mariam / Daniel) ---- */
function staffView(pid){
 const m=membership(pid,NB),org=S.orgs[NB];
 if(!m){return personalShell(pid,`<div class="empty"><strong>No organisations</strong><p class="small muted">${esc(PEOPLE[pid].name)} uses personal Orivia. When an organisation invites them, it appears here.</p></div>`)}
 if(m.status==='invited')return personalShell(pid,`<div class="card"><span class="chip c-wait" style="align-self:flex-start">Invitation</span><h3>${esc(org.name)} invited you to be ${m.role==='admin'?'an admin':'an editor'}</h3><p class="small">You’ll manage Northbay’s dashboard with your own Orivia account. Your personal chats stay private from Northbay.</p><div class="row"><button type="button" class="btn" data-action="acceptStaff">Accept</button><button type="button" class="btn quiet" data-action="declineStaff">Decline</button></div></div>`);
 if(m.status!=='active')return personalShell(pid,`<div class="empty"><strong>Not active at Northbay</strong></div>`);
 return orgDashboard(pid);
}
function personalShell(pid,inner){return `<div class="panel"><div class="row"><h2 class="grow">${esc(PEOPLE[pid].name)}’s Orivia</h2><span class="chip c-demo">Sample</span></div>${inner}</div>`}
let whyN=0;
function btn(pid,perm,label,action,attrs='',cls='btn'){const r=can(pid,perm,NB);const w='why-'+(++whyN);return r.ok?`<button type="button" class="${cls}" data-action="${action}" ${attrs}>${label}</button>`:`<span class="row" style="gap:6px"><button type="button" class="${cls}" disabled aria-describedby="${w}">${label}</button><span class="why" id="${w}">${esc(cap(r.why))}</span></span>`}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function orgDashboard(pid){
 const t=S.tab.org,m=membership(pid,NB);
 const tabs=[['overview','Overview'],['guides','Guides'],['members','Members'],['codes','QR codes and invitations'],['staff','Staff'],['analytics','Counts'],['records','Application records']].map(([k,l])=>`<button type="button" class="tab" role="tab" aria-selected="${t===k}" data-action="tab" data-area="org" data-id="${k}">${l}${k==='records'?'<span class="lock" aria-hidden="true"> · locked</span>':''}</button>`).join('');
 const pending=S.memberships.filter(x=>x.org===NB&&x.status==='requested');
 const active=S.memberships.filter(x=>x.org===NB&&x.role==='student'&&x.status==='active');
 let body='';
 if(t==='overview'){
  body=`<div class="kpis"><div class="kpi"><span class="small muted">Members</span><strong>${active.length}</strong></div><div class="kpi"><span class="small muted">Waiting for approval</span><strong>${pending.length}</strong></div><div class="kpi"><span class="small muted">Guides published</span><strong>${S.content.filter(c=>c.status==='published').length}</strong></div><div class="kpi"><span class="small muted">Invitations active</span><strong>${S.codes.filter(c=>c.purpose==='invitation'&&c.status==='active').length}</strong></div></div>
  ${pending.length?`<p class="note">${pending.length} join request${pending.length>1?'s':''} waiting. Open Members to decide.</p>`:''}
  ${!S.content.length?`<div class="empty"><strong>Start with a guide</strong><p class="small muted">Members see published guides inside their Orivia.</p><button type="button" class="btn quiet" data-action="tab" data-area="org" data-id="guides">Open guides</button></div>`:''}`;
 }
 if(t==='guides'){
  body=`<form class="row" data-form="draft" style="align-items:flex-end"><label class="field grow" for="guideTitle">New guide title<input id="guideTitle" name="title" value="Your first week at Northbay" required></label>${can(pid,'content.draft',NB).ok?'<button class="btn" type="submit">Save draft</button>':''}</form>
  ${S.content.length?`<div class="list">${S.content.map(c=>`<div class="item"><div class="grow"><strong>${esc(c.title)}</strong><p class="small muted">${c.status==='published'?'Published for members':'Draft'} · by ${esc(PEOPLE[c.author].name)}</p></div>${c.status==='draft'?btn(pid,'content.publish','Publish','publish',`data-id="${c.id}"`):'<span class="chip c-ok">Published</span>'}</div>`).join('')}</div>`:`<div class="empty"><strong>No guides yet</strong><p class="small muted">Editors and admins can draft. Only admins publish.</p></div>`}`;
 }
 if(t==='members'){
  body=`<h3>Join requests</h3>${pending.length?`<div class="list">${pending.map(x=>`<div class="item"><div class="grow"><strong>${esc(PEOPLE[x.person].name)}</strong><p class="small muted">${esc(PEOPLE[x.person].email)} · came from ${esc(x.via)}</p></div>${btn(pid,'members.manage','Approve','approve',`data-id="${x.person}"`,'btn ok')}${can(pid,'members.manage',NB).ok?`<button type="button" class="btn quiet" data-action="decline" data-id="${x.person}">Decline</button>`:''}</div>`).join('')}</div>`:`<div class="empty"><strong>No requests waiting</strong><p class="small muted">People join by opening a member invitation and asking to join. Staff approve each request.</p></div>`}
  <h3>Members</h3>${active.length?`<div class="list">${active.map(x=>`<div class="item"><div class="grow"><strong>${esc(PEOPLE[x.person].name)}</strong><p class="small muted">Student · joined ${esc(x.via)}</p></div>${can(pid,'members.manage',NB).ok?`<button type="button" class="btn danger" data-action="remove" data-id="${x.person}">Remove</button>`:''}</div>`).join('')}</div>`:`<p class="small muted">No members yet.</p>`}`;
 }
 if(t==='codes'){
  const f=S.form.code||{purpose:'invitation'};
  body=`<form class="panel" data-form="code" style="padding:0;border:0"><fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px"><legend class="small" style="font-weight:700;margin-bottom:6px">What is it for?</legend>
  <label class="row"><input type="radio" name="purpose" value="public" ${f.purpose==='public'?'checked':''} data-action="purpose"> <span><strong>Public information</strong> <span class="small muted">· posters and emails. Unlocks nothing private.</span></span></label>
  <label class="row"><input type="radio" name="purpose" value="invitation" ${f.purpose==='invitation'?'checked':''} data-action="purpose"> <span><strong>Member invitation</strong> <span class="small muted">· leads to a join request that staff approve. Expires.</span></span></label></fieldset>
  <div class="row"><label class="field grow" for="codeLabel">Name (staff only)<input id="codeLabel" name="label" value="${f.purpose==='public'?'Welcome desk poster':'Autumn cohort invitation'}"></label>${f.purpose==='invitation'?`<label class="field" for="codeExpiry">Expires after<select id="codeExpiry" name="expiry"><option value="14">14 days</option><option value="30">30 days</option></select></label>`:''}</div>
  ${btn(pid,f.purpose==='public'?'qr.public':'qr.invite','Create QR code','createCode')}</form>
  ${S.codes.length?`<div class="list">${S.codes.map(c=>`<div class="item"><canvas class="qr" width="25" height="25" data-qr="${esc(c.code)}" role="img" aria-label="Sample QR pattern for ${esc(c.label)}, not scannable"></canvas><div class="grow"><strong>${esc(c.label)}</strong><p class="small muted">${c.purpose==='public'?'Public information':'Member invitation · expires in '+c.expiry+' days'} · opened ${c.opens} · ${c.purpose==='invitation'?c.requests+' asked to join':''}</p>
  <p class="small"><span class="chip ${c.status==='active'?'c-ok':'c-warn'}">${c.status==='active'?'Active':c.status==='expired'?'Expired':'Revoked'}</span> <span class="chip c-demo">Sample pattern, not scannable</span></p></div>
  <div class="row"><button type="button" class="btn quiet" data-action="scanAs" data-id="${c.code}">Open it as Aisha</button>${c.status==='active'&&c.purpose==='invitation'?btn(pid,'qr.invite','Revoke','revoke',`data-id="${c.code}"`,'btn danger')+(can(pid,'qr.invite',NB).ok?`<button type="button" class="btn quiet" data-action="expire" data-id="${c.code}">Make it expire (demo)</button>`:''):''}</div></div>`).join('')}</div>`:`<div class="empty"><strong>No QR codes yet</strong><p class="small muted">Editors can make public codes. Admins can also make member invitations.</p></div>`}`;
 }
 if(t==='staff'){
  const staff=S.memberships.filter(x=>x.org===NB&&x.role!=='student');
  body=`<div class="list">${staff.map(x=>`<div class="item"><div class="grow"><strong>${esc(PEOPLE[x.person].name)}</strong><p class="small muted">${x.role==='admin'?'Admin: publishes, approves members, manages invitations and staff':'Editor: drafts guides, makes public QR codes'}</p></div><span class="chip ${x.status==='active'?'c-ok':'c-wait'}">${x.status==='active'?cap(x.role):'Invited'}</span></div>`).join('')}</div>
  ${!membership('daniel',NB)?btn(pid,'staff.manage','Invite Daniel O. as editor','inviteEditor'):''}
  <p class="note">A verified university email never makes someone staff. Staff are invited by an admin.</p>`;
 }
 if(t==='analytics'){
  body=`<div class="kpis"><div class="kpi"><span class="small muted">QR code opens</span><strong>${shown(count('qr_open'))}</strong></div><div class="kpi"><span class="small muted">Guide views</span><strong>${shown(count('guide_view'))}</strong></div><div class="kpi"><span class="small muted">Joins</span><strong>${shown(count('join'))}</strong></div></div>
  <p class="note">Counts come only from things people clicked: opening a QR code, viewing a guide, joining. Orivia doesn’t read private conversations to fill this page. Groups under 10 are hidden, which lowers the chance of identifying someone but doesn’t guarantee anonymity.</p>`;
  if(!can(pid,'analytics.view',NB).ok)body=`<p class="why">Can’t see counts.</p>`;
 }
 if(t==='records'){
  const r=can(pid,'records.view',NB);
  body=r.ok?'':`<div class="denied"><strong>Application records need a separate permission</strong><p class="small">Being an admin isn’t enough to see an individual student’s application record. Nobody at Northbay has this permission in the demo, and no university system is connected.</p></div>`;
 }
 return `<div class="panel"><div class="row"><h2 class="grow">Northbay University</h2><span class="chip c-demo">Demo organisation</span><span class="small muted">${esc(PEOPLE[pid].name)} · ${cap(m.role)}</span></div><div class="tabs" role="tablist" aria-label="Organisation">${tabs}</div>${body}</div>`;
}

/* ---- Student (Aisha) and non-member (Omar) ---- */
function studentView(pid){
 const m=membership(pid,NB),me=S.personal[pid]||{calendar:[],steps:[],saved:[]};
 const active=m&&m.status==='active';
 const t=active?S.tab.student:'me';
 const spaces=`<div class="spaces" role="tablist" aria-label="Spaces"><button type="button" class="space" role="tab" aria-selected="${t==='me'}" data-action="space" data-id="me">Me</button>${active?`<button type="button" class="space" role="tab" aria-selected="${t==='northbay'}" data-action="space" data-id="northbay">Northbay University</button>`:''}</div>`;
 let body='';
 const sc=S.studentScreen;
 if(sc&&sc.kind==='code'){
  const c=S.codes.find(x=>x.code===sc.code);
  if(c.purpose==='public'){body=publicPage()}
  else if(c.status!=='active'){body=`<div class="card"><span class="chip c-warn" style="align-self:flex-start">${c.status==='expired'?'Invitation expired':'Invitation no longer valid'}</span><h3>This invitation can’t be used</h3><p class="small">It ${c.status==='expired'?'has expired':'was withdrawn by Northbay'}. Ask Northbay’s international office for a new invitation. Nothing in your Orivia has changed.</p><button type="button" class="btn quiet" data-action="closeScreen">Back to my Orivia</button></div>`}
  else if(m&&m.status==='requested'){body=pendingCard()}
  else if(active){body=`<div class="card"><h3>You’re already a Northbay member</h3><button type="button" class="btn" data-action="space" data-id="northbay">Open Northbay</button></div>`}
  else body=joinCard(pid);
 } else if(sc&&sc.kind==='denied'){
  body=`<div class="denied"><strong>You don’t have access to this</strong><p class="small">${esc(sc.text)}</p><p class="small">If you think you should, ask the organisation for an invitation.</p><button type="button" class="btn quiet" data-action="closeScreen">Back to my Orivia</button></div>`;
 } else if(sc&&sc.kind==='leave'){
  body=`<div class="card"><h3>Leave Northbay University?</h3><ul class="small" style="margin:0;padding-left:18px"><li>Northbay’s guides, contacts and updates disappear from your Orivia, and Northbay staff can no longer see you as a member.</li><li>Your chats, your own steps and dates you saved to your calendar stay yours.</li><li>Guides you downloaded stay on your device but won’t update. They may go out of date.</li></ul><div class="row"><button type="button" class="btn danger" data-action="leave">Leave Northbay</button><button type="button" class="btn quiet" data-action="closeScreen">Stay</button></div></div>`;
 } else if(sc&&sc.kind==='support'){
  body=`<form class="card" data-form="support"><h3>Ask Orivia for help</h3><label class="field" for="supSubject">What’s wrong?<input id="supSubject" name="subject" value="My Northbay invitation won’t open"></label><fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px"><legend class="small" style="font-weight:700;margin-bottom:4px">Attach (only what you tick is sent)</legend><label class="row small"><input type="checkbox" name="att" value="the invitation link" checked> The invitation link</label><label class="row small"><input type="checkbox" name="att" value="my account email"> My account email</label><label class="row small"><input type="checkbox" name="att" value="a copy of my latest chat"> A copy of my latest chat</label></fieldset><p class="small muted">Orivia staff can’t open your chats. They see only what you attach here.</p><div class="row"><button class="btn" type="submit">Send request</button><button type="button" class="btn quiet" data-action="closeScreen">Cancel</button></div></form>`;
 } else if(t==='northbay'){body=northbaySpace(pid,me)}
 else body=meHome(pid,me,m);
 if(t==='northbay'&&!sc)S.seenSpace=true;
 return `<div class="phone" aria-label="${esc(PEOPLE[pid].name)}’s phone"><div class="phone-top"><div class="row"><strong class="brand grow">ORIVIA</strong><span class="tag">Demo</span></div>${spaces}</div><div class="phone-body">${body}</div></div>`;
}
function meHome(pid,me,m){
 const codes=S.codes;
 return `<h2 style="font-size:26px">Good morning, ${esc(PEOPLE[pid].name.split(' ')[0])}</h2>
 ${m&&m.status==='requested'?pendingCard():''}
 <div class="card"><h3>Scan a QR code</h3><p class="small muted">In real life you’d point your camera at a poster or open an email. Here, pick one Northbay has made.</p>${codes.length?codes.map(c=>`<button type="button" class="btn quiet" data-action="scan" data-id="${c.code}">${esc(c.label)}</button>`).join(''):'<p class="small muted">Northbay hasn’t made any QR codes yet.</p>'}</div>
 <div class="card"><h3>My calendar</h3>${me.calendar.length?me.calendar.map(d=>`<p class="small">${esc(d.when)} · ${esc(d.what)} <span class="muted">(saved by you)</span></p>`).join(''):'<p class="small muted">No saved dates.</p>'}</div>
 <div class="card"><h3>My chats</h3><p class="small muted">${me.chats??0} private conversations. Only you can see them.</p></div>
 ${pid==='omar'?`<div class="card"><h3>Try a link someone shared</h3><button type="button" class="btn quiet" data-action="tryStaff">Northbay staff dashboard</button><button type="button" class="btn quiet" data-action="trySpace">Northbay student space</button></div>`:''}
 <button type="button" class="btn quiet" data-action="supportForm">Get help from Orivia</button>`;
}
function joinCard(pid){return `<div class="card"><span class="chip c-wait" style="align-self:flex-start">Invitation</span><h3>Northbay University invited you to connect your Orivia</h3><p class="small">Signed in as <strong>${esc(PEOPLE[pid].email)}</strong>. Joining adds Northbay to your Orivia. It doesn’t create a second account.</p><p class="small"><strong>You’ll get:</strong> Northbay’s guides, key dates, contacts and updates it supplies.</p><p class="small"><strong>Northbay won’t see:</strong> your chats, calendar, About me or your own steps.</p><p class="small muted">Staff see your name and email and approve your request.</p><div class="row"><button type="button" class="btn" data-action="askJoin">Ask to join Northbay</button><button type="button" class="btn quiet" data-action="closeScreen">Not now</button></div></div>`}
function pendingCard(){return `<div class="card"><span class="chip c-wait" style="align-self:flex-start">Waiting for Northbay</span><h3>Your request is with Northbay’s staff</h3><p class="small">You’ll see Northbay in your Orivia once they approve it. You can keep using your Orivia meanwhile.</p></div>`}
function publicPage(){return `<div class="card"><span class="chip c-ok" style="align-self:flex-start">Public page</span><h3>Northbay University</h3><p class="small">Welcome desk: Block A, ground floor. International office hours are posted here.</p><p class="small muted">This public code opens information only. It doesn’t make you a member or unlock anything private.</p><button type="button" class="btn quiet" data-action="closeScreen">Back to my Orivia</button></div>`}
function northbaySpace(pid,me){
 const guides=S.content.filter(c=>c.status==='published');
 return `<h2 style="font-size:26px">Your Northbay space</h2><p class="small muted">From Northbay University. Your own chats and plans stay in Me.</p>
 <div class="card"><h3>Guides from Northbay</h3>${guides.length?guides.map(g=>`<button type="button" class="btn quiet" data-action="viewGuide" data-id="${g.id}">${esc(g.title)}</button>`).join(''):'<p class="small muted">Northbay hasn’t published guides yet.</p>'}</div>
 <div class="card"><h3>Key dates</h3><p class="small">28 Oct · Enrolment check-in, Student Hub</p><button type="button" class="btn quiet" data-action="saveDate">Save to my calendar</button>${me.calendar.length?'<p class="small muted">Saved. It stays in your calendar even if you leave Northbay.</p>':''}</div>
 <div class="card"><div class="row"><h3 class="grow">From Northbay</h3><span class="chip c-demo">Demo</span></div><p class="small muted">Updates Northbay supplied. Northbay already knows these.</p>
 <div class="step"><span class="dot done" aria-hidden="true">✓</span><span class="small">Offer accepted</span></div><div class="step"><span class="dot done" aria-hidden="true">✓</span><span class="small">Student visa application submitted by Northbay</span></div><div class="step"><span class="dot" aria-hidden="true"></span><span class="small muted">Emirates ID: Northbay will update this</span></div></div>
 <div class="card"><h3>Your own steps</h3><p class="small muted">Things you’re tracking yourself. Private unless you choose to share.</p>${me.steps.map(s=>`<label class="step small"><input type="checkbox" data-action="toggleStep" data-id="${s.id}" ${s.done?'checked':''}> ${esc(s.text)}</label>`).join('')}
 <label class="row small" style="border-top:1px solid var(--line);padding-top:10px"><input type="checkbox" data-action="shareSteps" ${me.shareSteps?'checked':''}> Share my own steps with Northbay staff</label><p class="small muted">Off unless you turn it on. Your chats are never shared.</p></div>
 <div class="card"><h3>Contacts</h3><p class="small"><strong>International office</strong> · visas, Emirates ID, medical tests</p><p class="small muted">Phone and email appear here once Northbay adds them.</p></div>
 <button type="button" class="btn danger" data-action="leaveForm">Leave Northbay University</button>`;
}

/* ---------- QR pattern (deterministic sample, not a real code) ---------- */
function drawQRs(){document.querySelectorAll('canvas[data-qr]').forEach(cv=>{const ctx=cv.getContext('2d');let h=0;for(const ch of cv.dataset.qr)h=(h*31+ch.charCodeAt(0))>>>0;ctx.fillStyle='#fff';ctx.fillRect(0,0,25,25);ctx.fillStyle='#111';
 const finder=(x,y)=>{ctx.fillRect(x,y,7,7);ctx.fillStyle='#fff';ctx.fillRect(x+1,y+1,5,5);ctx.fillStyle='#111';ctx.fillRect(x+2,y+2,3,3)};
 for(let y=0;y<25;y++)for(let x=0;x<25;x++){h=(h*1103515245+12345)>>>0;if((h>>16)&1)ctx.fillRect(x,y,1,1)}
 ctx.fillStyle='#fff';ctx.fillRect(0,0,8,8);ctx.fillRect(17,0,8,8);ctx.fillRect(0,17,8,8);ctx.fillStyle='#111';finder(0,0);finder(18,0);finder(0,18)})}

/* ---------- Actions ---------- */
const P=()=>S.persona;
const actions={
 reset(){S=fresh();log('Demo reset to an empty platform.')},
 persona(el){S.persona=el.dataset.id;S.studentScreen=null;if(['mariam','daniel'].includes(S.persona)&&!['overview','guides','members','codes','staff','analytics','records'].includes(S.tab.org))S.tab.org='overview'},
 tab(el){S.tab[el.dataset.area]=el.dataset.id;if(el.dataset.id==='records'){const r=can(P(),'records.view',NB);log((r.ok?'Allowed: ':'Refused: ')+PEOPLE[P()].name+' — open application records',{perm:'records.view',ok:r.ok,why:r.why})}},
 newOrgForm(){S.form.newOrg=true},cancelOrg(){S.form.newOrg=false},
 acceptStaff(){const m=membership(P(),NB);m.status='active';S.tab.org='overview';log(PEOPLE[P()].name+' accepted the Northbay '+m.role+' invitation with their own Orivia account.')},
 declineStaff(){S.memberships=S.memberships.filter(m=>!(m.person===P()&&m.org===NB));log(PEOPLE[P()].name+' declined the Northbay invitation.')},
 publish(el){if(!guard(P(),'content.publish',NB,'publish a guide'))return;const c=S.content.find(x=>x.id===el.dataset.id);c.status='published'},
 approve(el){if(!guard(P(),'members.manage',NB,'approve '+PEOPLE[el.dataset.id].name))return;const m=membership(el.dataset.id,NB);m.status='active';S.events.push({type:'join'})},
 decline(el){if(!guard(P(),'members.manage',NB,'decline '+PEOPLE[el.dataset.id].name))return;S.memberships=S.memberships.filter(m=>!(m.person===el.dataset.id&&m.org===NB))},
 remove(el){if(!guard(P(),'members.manage',NB,'remove '+PEOPLE[el.dataset.id].name))return;membership(el.dataset.id,NB).status='left'},
 purpose(el){S.form.code={purpose:el.value}},
 createCode(){const f=S.form.code||{purpose:'invitation'};const perm=f.purpose==='public'?'qr.public':'qr.invite';
  const label=(document.getElementById('codeLabel')||{}).value||'QR code';const expiry=(document.getElementById('codeExpiry')||{}).value||'';
  if(!guard(P(),perm,NB,'create a '+(f.purpose==='public'?'public QR code':'member invitation')))return;
  S.codes.push({code:id('nb-'),label,purpose:f.purpose,expiry,status:'active',opens:0,requests:0,by:P()})},
 revoke(el){if(!guard(P(),'qr.invite',NB,'revoke an invitation'))return;S.codes.find(c=>c.code===el.dataset.id).status='revoked'},
 expire(el){S.codes.find(c=>c.code===el.dataset.id).status='expired';log('Demo: invitation set to expired.')},
 inviteEditor(){if(!guard(P(),'staff.manage',NB,'invite Daniel O. as editor'))return;S.memberships.push({person:'daniel',org:NB,role:'editor',status:'invited',via:'staff invitation'})},
 scanAs(el){S.persona='aisha';actions.scan(el)},
 scan(el){const c=S.codes.find(x=>x.code===el.dataset.id);if(c.status==='active'){c.opens++;S.events.push({type:'qr_open'})}S.studentScreen={kind:'code',code:c.code};log(PEOPLE[P()].name+' opened “'+c.label+'” ('+(c.purpose==='public'?'public information':'member invitation, '+c.status)+').')},
 askJoin(){const c=S.codes.find(x=>x.code===S.studentScreen.code);if(c.status!=='active'){log('Refused: invitation is '+c.status+'.',{perm:'invitation.use',ok:false,why:'invitation '+c.status});return}
  const old=membership(P(),NB);if(old){old.status='requested';old.via=c.label}else S.memberships.push({person:P(),org:NB,role:'student',status:'requested',via:c.label});c.requests++;S.studentScreen=null;log(PEOPLE[P()].name+' asked to join Northbay. Staff approval needed; a verified email would never grant staff access.')},
 closeScreen(){S.studentScreen=null},
 space(el){S.tab.student=el.dataset.id;S.studentScreen=null;if(el.dataset.id==='northbay'){const r=can(P(),'space.view',NB);log((r.ok?'Allowed: ':'Refused: ')+PEOPLE[P()].name+' — open the Northbay space',{perm:'space.view',ok:r.ok,why:r.why})}},
 viewGuide(){S.events.push({type:'guide_view'});log(PEOPLE[P()].name+' viewed a Northbay guide (counted as a guide view, no content of chats recorded).')},
 saveDate(){const me=S.personal[P()];if(!me.calendar.length)me.calendar.push({when:'28 Oct',what:'Enrolment check-in, Student Hub'});log(PEOPLE[P()].name+' saved a Northbay date to their personal calendar.')},
 toggleStep(el){const s=S.personal[P()].steps.find(x=>x.id===el.dataset.id);s.done=el.checked},
 shareSteps(el){S.personal[P()].shareSteps=el.checked;log(PEOPLE[P()].name+(el.checked?' chose to share their own steps with Northbay staff.':' stopped sharing their own steps.'))},
 leaveForm(){S.studentScreen={kind:'leave'}},
 leave(){const m=membership(P(),NB);m.status='left';S.tab.student='me';S.studentScreen=null;log(PEOPLE[P()].name+' left Northbay. Institutional access revoked; personal chats, steps and saved dates kept.')},
 supportForm(){S.studentScreen={kind:'support'}},
 tryStaff(){const r=can(P(),'org.view',NB);log('Refused: '+PEOPLE[P()].name+' — open the Northbay staff dashboard',{perm:'org.view',ok:r.ok,why:r.why});S.studentScreen={kind:'denied',text:'The Northbay staff dashboard is only for staff Northbay has invited.'}},
 trySpace(){const r=can(P(),'space.view',NB);log('Refused: '+PEOPLE[P()].name+' — open the Northbay student space',{perm:'space.view',ok:r.ok,why:r.why});S.studentScreen={kind:'denied',text:'The Northbay space is only for members Northbay has approved.'}}
};
const forms={
 createOrg(fd){if(!guard('habeebah','org.create',null,'create an organisation'))return;S.orgs[NB]={id:NB,name:fd.get('name')||'Northbay University',type:fd.get('type'),city:fd.get('city'),demo:true};S.form.newOrg=false},
 inviteAdmin(fd){if(!guard('habeebah','org.inviteAdmin',null,'invite Northbay’s first admin'))return;S.memberships.push({person:'mariam',org:NB,role:'admin',status:'invited',via:'owner invitation'});log('Invitation sent to '+(fd.get('email')||'')+' (sample, no email is really sent).')},
 draft(fd){if(!guard(P(),'content.draft',NB,'draft a guide'))return;S.content.push({id:id('g'),title:fd.get('title')||'Untitled guide',status:'draft',author:P()})},
 code(){actions.createCode()},
 support(fd){const att=fd.getAll('att');S.support.push({from:P(),subject:fd.get('subject')||'Help',org:membership(P(),NB)?'Northbay University':'',attached:att});S.studentScreen=null;log(PEOPLE[P()].name+' sent a support request with only what they attached: '+(att.join(', ')||'nothing')+'.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;
 if(['purpose','toggleStep','shareSteps'].includes(a))return;
 if(actions[a]){e.preventDefault();actions[a](el);render()}});
document.addEventListener('change',e=>{const el=e.target;const a=el.dataset&&el.dataset.action;if(['purpose','toggleStep','shareSteps'].includes(a)){actions[a](el);render()}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();forms[f.dataset.form](new FormData(f));render()});
const _render=render;render=function(){_render();drawQRs()};
render();
</script>
